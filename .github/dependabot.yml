# No `uv` entry: Dependabot cannot reach Paddle's CUDA index (403), so uv.lock updates always fail.
# Security alerts still cover uv.lock; upgrade with `uv lock --upgrade-package <name>`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
