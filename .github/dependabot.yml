# No `uv` entry: Dependabot cannot reach Paddle's CUDA index (403), so uv.lock updates always fail.
# Security alerts still cover uv.lock; upgrade with `uv lock --upgrade-package <name>`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # vue-tsc (via @volar/typescript) requires typescript <7; drop once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The project requires Python 3.11 (requires-python, Paddle builds); only take 3.11 image updates.
      - dependency-name: python
        versions: [">=3.12"]
